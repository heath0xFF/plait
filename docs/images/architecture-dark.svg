.ic{fill:none;stroke:#4c9bff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic .fill{fill:#262c36}
.dim{stroke:#59636e}
.wire{fill:none;stroke:#4c9bff;stroke-width:2}
.wiredash{fill:none;stroke:#59636e;stroke-width:2;stroke-dasharray:6 6}
