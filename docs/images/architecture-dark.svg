<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1020" width="1500" height="1020" role="img" aria-labelledby="t d">
<title id="t">How Plait works</title>
<desc id="d">The Plait desktop (Rust and GPUI) talks to a host daemon on this Mac over a local socket. The host runs Pi with durable threads, applies approved file edits, runs sandboxed commands, and calls model providers. The desktop runs hardened Git on your repository itself. Additional machines are planned.</desc>
