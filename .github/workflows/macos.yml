name: macOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.12.0'
      - name: Check native build tools
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          if ! xcrun --sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          rustup show
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          for name in ['metal', 'metallib']:
              path = Path(subprocess.check_output(['xcrun', '--sdk', 'macosx', '--find', name], text=True).strip()).resolve()
              for item in [path, *list(path.parents)[:5]]:
                  info = item.stat()
                  print(name, item, 'uid', info.st_uid, 'mode', oct(info.st_mode & 0o777))
          PY
      - name: Check workspace and real command sandbox
        run: bash scripts/check.sh --require-command-sandbox
      - name: Check runtime recovery without credentials
        working-directory: experiments/pi-durable
        run: |
          npm ci --ignore-scripts
          npm test
      - name: Check installer planning
        run: python3 -m unittest discover -s scripts -p 'test_release_*.py'
      - name: Build and verify client and host installers
        run: bash scripts/build-macos.sh
      - name: Install and test packaged client and daemon
        run: bash scripts/smoke-installer-macos.sh
      - name: Upload development package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plait-macos-arm64-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.sha256
            dist/*.pkg
            dist/Plait-Release-*.json
            dist/installed-client.png
            dist/installed-client.log
          if-no-files-found: error
          retention-days: 14
