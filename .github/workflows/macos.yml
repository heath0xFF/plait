name: macOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.12.0'
      - name: Check native build tools
        id: native-tools
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          if ! xcrun --sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          rustup show
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          for name in ['metal', 'metallib']:
              path = Path(subprocess.check_output(['xcrun', '--sdk', 'macosx', '--find', name], text=True).strip()).resolve()
              for item in [path, *list(path.parents)[:5]]:
                  info = item.stat()
                  print(name, item, 'uid', info.st_uid, 'mode', oct(info.st_mode & 0o777))
          PY
          node --input-type=module - <<'JS'
          import { mkdtemp, rm } from 'node:fs/promises';
          import { appleToolchain } from './runtime/src/apple-toolchain.ts';
          const scratch = await mkdtemp('/private/tmp/plait-toolchain-check-');
          try {
            const tools = await appleToolchain(scratch, AbortSignal.timeout(20000));
            if (!tools.bin) throw new Error('No trusted installed Metal toolchain is available.');
            console.log('Root-owned Metal tool discovery passed; sandbox tests still follow.');
          } finally { await rm(scratch, { recursive: true, force: true }); }
          JS
          cache_id=$({ xcodebuild -version; sw_vers -productVersion; xcrun --sdk macosx metal --version | awk 'NR == 1'; } | shasum -a 256 | awk '{print $1}')
          echo "cache-id=$cache_id" >> "$GITHUB_OUTPUT"
      - name: Restore native build cache
        id: cargo-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/release
            target/build-tools
            target/release-inputs
          key: macos26-${{ runner.arch }}-${{ steps.native-tools.outputs.cache-id }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: macos26-${{ runner.arch }}-${{ steps.native-tools.outputs.cache-id }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
      - name: Check workspace and real command sandbox
        run: bash scripts/check.sh --require-command-sandbox
      - name: Check runtime recovery without credentials
        working-directory: experiments/pi-durable
        run: |
          npm ci --ignore-scripts
          npm test
      - name: Check installer planning
        run: python3 -m unittest discover -s scripts -p 'test_release_*.py'
      - name: Build and verify client and host installers
        run: bash scripts/build-macos.sh
      - name: Install and test packaged client and daemon
        run: bash scripts/smoke-installer-macos.sh
      - name: Upload development package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plait-macos-arm64-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.sha256
            dist/*.pkg
            dist/Plait-Release-*.json
            dist/installed-client.png
            dist/installed-client.log
          if-no-files-found: error
          retention-days: 14
      - name: Save native build cache
        if: always() && steps.cargo-cache.outcome == 'success' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/release
            target/build-tools
            target/release-inputs
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
