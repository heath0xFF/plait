[package]
name = "plait"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
plait-core = { path = "../plait-core" }
serde = { version = "=1.0.229", features = ["derive"] }
unicode-segmentation = "=1.13.3"

# Linux-only layout snapshots (see src/ui/snapshot.rs). GPUI's headless renderer
# lets a machine without a display inspect layout. Not a macOS renderer check.
[target.'cfg(target_os = "linux")'.dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui_platform = { workspace = true, features = ["test-support"] }
gpui_wgpu = { workspace = true, features = ["test-support"] }
